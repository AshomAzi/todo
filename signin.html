<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskCore - Sign In</title>
    <link rel="stylesheet" href="css/signin.css">
</head>

<body>

    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">TaskCore.</a>
            <nav class="nav-links">
                <a href="signup.html">Need an account? Create one</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="auth-card">
            <h1>Sign In</h1>
            <p class="subtitle">Access your task dashboard</p>

            <form action="" method="POST">

                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter your username" required
                        autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required
                        autocomplete="current-password">
                </div>

                <button type="submit" class="btn-submit">Sign In</button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="signup.html">Create one</a>
            </div>
        </div>
    </main>

    <footer>
        &copy; 2026 TaskCore. Pure Backend Engineering.
    </footer>

</body>

</html>
