<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskCore - Create Account</title>
    <link rel="stylesheet" href="css/signup.css">
</head>

<body>

    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">TaskCore.</a>
            <nav class="nav-links">
                <a href="signin.html">Already have an account? Sign In</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="auth-card">
            <h1>Create Account</h1>
            <p class="subtitle">Get started with your personal task dashboard</p>

            <form action="" method="POST">

                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Choose a username" required
                        autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="name@example.com" required
                        autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password1" placeholder="Create a strong password"
                        required autocomplete="new-password">
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" name="password2" placeholder="Repeat your password"
                        required autocomplete="new-password">
                </div>

                <button type="submit" class="btn-submit">Create Account</button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="signin.html">Sign In</a>
            </div>
        </div>
    </main>

    <footer>
        &copy; 2026 TaskCore. All Rights Reserver.
    </footer>

</body>

</html>
