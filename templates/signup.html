{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up</title>
    <link rel="stylesheet" href="{% static 'style/feed.css' %}">
    <link rel="stylesheet" href="{% static 'style/signup.css' %}">
</head>

<body>

    <div class="userInfo">
        <h1>Join To Add Task</h1>

        <form action="signup" method="post">
            {% csrf_token %}
            <label for="firstname">Firstname:
                <input type="text" name="firstname" id="firstname" placeholder=" Firstname" required>
            </label><br>
            <label for="lastname">Lastname:
                <input type="text" name="lastname" id="lastname" placeholder="Lastname" required>
            </label><br>
            <label for="username">Username:
                <input type="text" name="username" id="username" placeholder="Username" required>
            </label><br>
            <label for="email">Email:
                <input type="text" name="email" id="email" placeholder="Email" required>
            </label><br>
            <label for="password1">Password:
                <input type="password" name="password1" id="password1" required placeholder="Choose Password">
            </label><br>
            <label for="confirmPassword">Confirm Passwird:
                <input type="password" name="confirmPassword" id="confirmPassword" placeholder="Confirm Password"
                    required>
            </label><br>
            <button class="task-btn" type="submit">Submit</button>
            {% for message in messages %}
            {{message}}
            {% endfor %}
        </form>
    </div>


</body>

</html>
